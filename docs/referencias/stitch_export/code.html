<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <linearGradient id="hb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="35%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#D90429"/>
    </linearGradient>
    <linearGradient id="dirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8800"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#050811" flood-opacity="1"/>
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#FF5500" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background angled speed badge banner -->
  <path d="M 30 10 L 490 10 L 460 108 L 0 108 Z" fill="#0A0E17" stroke="#FF5500" stroke-width="3.5"/>
  <path d="M 45 18 L 475 18 L 452 98 L 22 98 Z" fill="#141B2D"/>
  
  <!-- Tire treads decorative pattern -->
  <g fill="#FF5500" opacity="0.25">
    <rect x="52" y="24" width="6" height="12" transform="skewX(-20)"/>
    <rect x="68" y="24" width="6" height="12" transform="skewX(-20)"/>
    <rect x="84" y="24" width="6" height="12" transform="skewX(-20)"/>
    <rect x="100" y="24" width="6" height="12" transform="skewX(-20)"/>
  </g>

  <!-- Motocross Helmet & Mountain silhouette emblem -->
  <g transform="translate(40, 22)">
    <polygon points="12,65 38,15 64,65" fill="#FF5500" opacity="0.3"/>
    <polygon points="28,65 52,28 76,65" fill="#A3E635" opacity="0.2"/>
    <!-- Stylized Moto Wheel Icon -->
    <circle cx="44" cy="46" r="20" fill="#0B0F19" stroke="#FF5500" stroke-width="5"/>
    <circle cx="44" cy="46" r="10" fill="#FF5500"/>
    <circle cx="44" cy="46" r="4" fill="#FFFFFF"/>
    <!-- Wheel knobby treads -->
    <line x1="44" y1="21" x2="44" y2="26" stroke="#FF5500" stroke-width="4" stroke-linecap="round"/>
    <line x1="44" y1="66" x2="44" y2="71" stroke="#FF5500" stroke-width="4" stroke-linecap="round"/>
    <line x1="19" y1="46" x2="24" y2="46" stroke="#FF5500" stroke-width="4" stroke-linecap="round"/>
    <line x1="64" y1="46" x2="69" y2="46" stroke="#FF5500" stroke-width="4" stroke-linecap="round"/>
    <line x1="26" y1="28" x2="30" y2="32" stroke="#FF5500" stroke-width="4" stroke-linecap="round"/>
    <line x1="58" y1="60" x2="62" y2="64" stroke="#FF5500" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Main Wordmark HILLBREAKER with slant and 3D arcade depth -->
  <g filter="url(#glow)" transform="skewX(-10)">
    <!-- Shadow extrusion -->
    <text x="135" y="77" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="2" fill="#050811">HILLBREAKER</text>
    <!-- Mid outline -->
    <text x="132" y="74" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="2" fill="#78350F">HILLBREAKER</text>
    <!-- Foreground Gradient text -->
    <text x="130" y="72" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="2" fill="url(#hb-grad)" stroke="#FFFFFF" stroke-width="1.2">HILLBREAKER</text>
  </g>

  <!-- Tagline Banner -->
  <g transform="translate(138, 78) skewX(-10)">
    <rect x="0" y="2" width="220" height="18" rx="3" fill="#A3E635"/>
    <text x="14" y="15" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" letter-spacing="3" fill="#0A0E17">“BREAK THE LIMITS.”</text>
  </g>
</svg>
